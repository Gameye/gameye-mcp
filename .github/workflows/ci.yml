name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p tsconfig.test.json
      - run: npm run build
      - name: Stdio smoke test
        run: npm run test:smoke
      - name: Check package contents
        run: npm pack --dry-run --json | node scripts/check-pack.mjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        if: ${{ !cancelled() }}
      - name: Stdio smoke test
        if: ${{ !cancelled() }}
        run: npm run test:smoke
      - name: Download the published package
        if: ${{ !cancelled() }}
        run: npm cache add gameye-mcp@latest
      - name: Diagnose npx start
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          GAMEYE_API_TOKEN: dummy
        run: |
          $init = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"t","version":"1"}}}'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $out = $init | cmd /c npx -y gameye-mcp@latest 2>&1
          "exit $LASTEXITCODE after $($sw.Elapsed.TotalSeconds) s"
          $out | Select-Object -First 3
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $out = $init | cmd /c npx -y gameye-mcp@latest 2>&1
          "second start: exit $LASTEXITCODE after $($sw.Elapsed.TotalSeconds) s"
      - name: Stdio smoke test of the published package through npx
        if: ${{ !cancelled() }}
        env:
          GAMEYE_MCP_SMOKE_CMD: '["cmd","/c","npx","-y","gameye-mcp@latest"]'
        run: npm run test:smoke

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the image (amd64)
        run: docker build -t gameye-mcp:ci .
      - name: Stdio smoke test against the image
        env:
          GAMEYE_MCP_SMOKE_CMD: '["docker","run","-i","--rm","-e","GAMEYE_API_TOKEN","gameye-mcp:ci"]'
        run: npm run test:smoke
      - name: Image runs as a non-root user
        run: '[ "$(docker run --rm --entrypoint id gameye-mcp:ci -u)" != "0" ]'

  internal-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scanner self-test
        run: node scripts/scan-internal-refs.mjs --self-test
      - name: Scan for internal references
        run: node scripts/scan-internal-refs.mjs

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit, not only the tip.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${archive}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "${archive}" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
      - name: Scan for secrets
        run: gitleaks detect --source . --redact --no-banner --verbose
