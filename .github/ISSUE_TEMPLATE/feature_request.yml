name: Feature request
description: Suggest a new tool, option or behaviour for gameye-mcp.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task you or your agent wanted to complete, and where the current tools fall short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The tool, input or behaviour you'd like. Mention any Gameye API operation it would use.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use today
